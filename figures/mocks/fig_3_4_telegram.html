<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Рисунок 3.4 — Telegram уведомление</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0e1621;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .window {
      width: 420px;
      background: #17212b;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    .titlebar {
      background: #232e3c;
      padding: 14px 16px;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      border-bottom: 1px solid #0e1621;
    }
    .titlebar span { color: #6ab2f2; font-weight: 500; }
    .chat {
      padding: 20px 16px 24px;
      min-height: 320px;
      background: linear-gradient(180deg, #0e1621 0%, #17212b 100%);
    }
    .bubble {
      background: #182533;
      border-radius: 12px 12px 12px 4px;
      padding: 14px 16px;
      max-width: 100%;
      color: #e4ecf4;
      font-size: 14px;
      line-height: 1.55;
      white-space: pre-wrap;
      border: 1px solid #2b5278;
    }
    .bubble strong { color: #6ab2f2; }
    .time {
      text-align: right;
      font-size: 11px;
      color: #6c7883;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div class="window">
    <div class="titlebar">TechnoService_Bot</div>
    <div class="chat">
      <div class="bubble">Новая заявка с сайта!

📅 Дата: 29.05.2026

👤 Имя: Роман

📞 Телефон: +7 (999) 123-45-67

🛠 Устройство: МФУ Kyocera ECOSYS

📝 Проблема: Заминает бумагу при печати.</div>
      <div class="time">14:32</div>
    </div>
  </div>
</body>
</html>
